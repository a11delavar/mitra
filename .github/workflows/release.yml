name: Release

# Turns a pushed SemVer tag into a GitHub Release. The body is written by scripts/releaseBody.ts:
# a minor's notes (releases/<minor>/README.md: title, intro, highlight headings and a link to
# the page on the website), a patch's pointer at its minor, then the tag's CHANGELOG.md section
# (generated from commits by `npm run changelog`). Pre-release tags (`-rc`/`-beta`/`-alpha`)
# are marked as such, and a backport (an older minor's patch) is never marked Latest.
#
# Cut a release with:  npm run release [version]
# (`docker.yml` builds the image off the same tag push, in parallel.)
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: 🏷️ Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the changelog is generated from every commit and tag

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # git-cliff alone: its binary needs no install scripts, and nothing here builds.
      - name: Generate Changelog
        run: |
          npm ci --ignore-scripts
          npm run changelog

      - name: Write Release Body
        run: node scripts/releaseBody.ts "${{ github.ref_name }}" > RELEASE_NOTES.md

      # The update-check manifest: instances on the release channel resolve it via
      # `releases/latest/download/mitra.json` (see src/backend/updates.ts). Shipping it as a release
      # asset (rather than letting checkers hit the API) makes GitHub count every check in the
      # asset's public `download_count`: the project's only ambient adoption signal (per release,
      # ≈ active stable instances × 4 checks/day), with zero infrastructure and nothing sent beyond
      # the request itself.
      - name: Write Update Manifest
        run: |
          printf '{"version":"%s","url":"https://github.com/%s/releases/tag/%s"}\n' \
            "${{ github.ref_name }}" "${{ github.repository }}" "${{ github.ref_name }}" > mitra.json

      # Only the newest stable tag is Latest, which `releases/latest/download/mitra.json` follows: a
      # backport tagged later would otherwise offer every newer instance a "downgrade".
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          newest="$(git tag -l 'v*' | grep -v -- - | sort -V | tail -n 1)"
          [ -z "$flags" ] && [ "$newest" != "$GITHUB_REF_NAME" ] && flags="--latest=false"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            $flags \
            mitra.json

      # A tag on main arrives with its release commit, which rebuilds the site; a backport's tag has
      # no commit there, so its changelog section reaches the site through a build of main.
      - name: Rebuild Website
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || gh workflow run website.yml --ref main
