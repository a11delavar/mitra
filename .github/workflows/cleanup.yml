name: Cleanup GHCR

# GHCR never garbage-collects, so two things pile up forever:
#   • untagged manifests: multi-arch publishes leave child images, and a moved
#     `dev` tag orphans its previous digest;
#   • per-commit `sha-*` tags: one per push to main.
# This prunes both. It starts in DRY-RUN: check the run summary, then set
# `dry-run: false` once the selection looks right. `latest`, `dev` and release
# tags (X.Y.Z / X.Y / X) are never matched.
# `account` is the literal `user` for a personal account: any other value is
# taken as an organization name and queried through `/orgs/<name>/` (a 404).
on:
  schedule:
    - cron: '0 4 * * 0' # Sundays 04:00 UTC
  workflow_dispatch:

jobs:
  cleanup:
    name: 🧹 Prune Images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Orphaned multi-arch children included.
      - name: Delete Untagged Versions
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: user
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: mitra
          tag-selection: untagged
          cut-off: 1w
          dry-run: true

      # The `sha-*` tags, keeping the most recent.
      - name: Prune Commit Tags
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: user
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: mitra
          tag-selection: tagged
          image-tags: 'sha-*'
          cut-off: 1w
          keep-n-most-recent: 10
          dry-run: true
