name: Website

# Builds website/ (the homepage and ./docs) and publishes it as a static image to GHCR.
# A push to main becomes `latest`, which the server pulls. Pull requests only build.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'assets/**'
      - 'src/design/**'
      - 'src/integrations/*/logo.svg'
      - 'package.json'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - 'assets/**'
      - 'src/design/**'
      - 'src/integrations/*/logo.svg'
      - 'package.json'
      - '.github/workflows/website.yml'
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # docs pages date themselves from `git log`

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build the site
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Compute image tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-website
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: website
          # Copies files onto Caddy, so emulating arm64 costs nothing worth skipping.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
