name: Docker

# Builds and publishes the container image to GHCR.
#
# Tagging (handled entirely by docker/metadata-action, off the git ref):
#   • push to main         → `dev` (rolling) + `sha-<short>` (immutable per commit)
#   • push tag `vX.Y.Z`    → `X.Y.Z`, `X.Y`, `X`, and `latest` (each moving one only while
#                            this is the newest stable tag it covers, so a backport keeps out)
#   • push tag `vX.Y.Z-rc.N` → only `X.Y.Z-rc.N` (no floating `X`/`X.Y`, no `latest`)
#   • pull request          → `pr-<number>` (rolling with each push), for testing a fix before it lands;
#                             one from a fork has no write access to the registry, so it only builds
# Pushing the tag is the single trigger: `release.yml` turns the same tag into a
# GitHub Release with commit-based notes, in parallel.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🐳 Build Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so `git describe` below can reach the nearest tag.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type Check
        run: npm run typecheck

      # The version string baked into the app (see scripts/esbuild.ts): the tag itself on tag builds,
      # `v0.3.0-14-ga1b2c3d` on main/PR builds. It's passed into the image as a build ARG since the
      # Docker context carries no .git to compute it from.
      - name: Compute Version
        id: version
        run: |
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # The changelog the About dialog serves, into the build context (which carries no .git). A `dev`
      # image also lists the commits past the last tag as `[Unreleased]`; at a tag there are none.
      - name: Generate Changelog
        run: npm run changelog -- --unreleased

      # A backport (a 0.6.x tagged after 0.7.0) must not take `latest` or its major back from the newer
      # line, so each moving tag follows only the newest stable tag it covers.
      - name: Rank Tag
        id: rank
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="$GITHUB_REF_NAME"; version="${tag#v}"; major="${version%%.*}"; rest="${version#*.}"; minor="${rest%%.*}"
          newest() { git tag -l "$1" | grep -v -- - | sort -V | tail -n 1; }
          echo "latest=$([ "$(newest 'v*')" = "$tag" ] && echo auto || echo false)" >> "$GITHUB_OUTPUT"
          echo "major=$([ "$(newest "v$major.*")" = "$tag" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "minor=$([ "$(newest "v$major.$minor.*")" = "$tag" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Compute Tags & Labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest=auto`: applied to stable semver tags, and automatically skipped
          # for pre-releases (e.g. v1.2.3-rc.1).
          flavor: latest=${{ steps.rank.outputs.latest || 'auto' }}
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.rank.outputs.minor || 'true' }}
            type=semver,pattern={{major}},enable=${{ steps.rank.outputs.major || 'true' }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log In to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          # arm64 is emulated (QEMU), so only build it for real publishes; fork PRs stay fast.
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MITRA_VERSION=${{ steps.version.outputs.version }}
            MITRA_COMMIT=${{ steps.version.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
