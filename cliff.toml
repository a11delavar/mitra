# git-cliff generates CHANGELOG.md from the commit history.
# Author/refresh with `npm run changelog` (stamp a version with `-- --tag vX.Y.Z`).
[changelog]
header = """
# Changelog

All notable changes to Mitra are documented here.\n
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/a11delavar/mitra/commit/{{ commit.id }}))
{% endfor -%}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
# Runs of spaces collapse, so a stray double space never reaches the release notes.
commit_preprocessors = [
	{ pattern = ' {2,}', replace = " " },
]
# Groups sort by name, so each leads with its place as an HTML comment, which the template strips.
commit_parsers = [
	{ message = "^release", skip = true },
	{ message = "^followup", skip = true },
	{ message = "^feat", group = "<!-- 0 -->✨ Features" },
	{ message = "^perf", group = "<!-- 1 -->⚡ Performance" },
	{ message = "^fix", group = "<!-- 2 -->🐛 Bug Fixes" },
	{ message = "^docs", group = "<!-- 3 -->📝 Documentation" },
	{ message = "^test", group = "<!-- 4 -->✅ Tests" },
	{ message = "^ci|^build|^infra", group = "<!-- 5 -->🏗️ Infrastructure" },
	{ message = "^refactor", group = "<!-- 6 -->🧹 Refactors" },
	{ message = "^chore", group = "<!-- 7 -->🔧 Chores" },
	{ message = ".*", group = "<!-- 8 -->🔹 Other" },
]
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "newest"
